[project]
name = "mojo-resampy"
version = "0.1.0"
description = "resampy's band-limited sample-rate conversion kernels in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "audio", "resampling", "signal-processing"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "resampy"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-resampy"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
